services:
  - type: web
    name: foodie-school-demo
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --access-logfile - --error-logfile - app:app
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FOODIE_ENV
        value: production
      - key: FOODIE_HTTPS
        value: "1"
      - key: FOODIE_AUTO_BACKUP
        value: "0"
      - key: FOODIE_SECRET_KEY
        generateValue: true
